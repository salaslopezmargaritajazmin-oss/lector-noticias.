<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Noticias en Tiempo Real</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="encabezado">
        <h1>Portal de Noticias en Tiempo Real</h1>
        <p>Últimos titulares actualizados mediante Fetch y JSON</p>
        <button id="btn-refrescar" class="btn-refrescar">Actualizar noticias</button>
    </header>

    <main class="contenedor-principal">
        <!-- Mensaje de estado (cargando o errores) -->
        <div id="mensaje-estado" class="mensaje-estado"></div>

        <!-- Área específica donde se mostrarán las noticias -->
        <section id="contenedor-noticias" class="grid-noticias"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
